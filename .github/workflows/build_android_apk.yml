name: Build Paṭṭhāna Quest 24 Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK manager and install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: $ANDROID_HOME"
          ls -lah "$ANDROID_HOME" || true
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under Android SDK. Inspect installed commandline tools."
            find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi
          echo "Found SDK manager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Godot editor and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-bin /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          curl --fail -L --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
          curl --fail -L --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"
      - name: Verify 24 levels and illustrations
        run: python3 qa/check_project.py
      - name: Configure Android paths for Godot headless
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import and check Godot syntax
        run: /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Launch headless smoke test
        run: /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --quit-after 12
      - name: Generate debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias patthana -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Patthana Debug,O=AAII,C=MM"
      - name: Export Android Debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: patthana
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-debug Android "$GITHUB_WORKSPACE/build/Patthana_Quest24_Debug.apk"
          test -s build/Patthana_Quest24_Debug.apk
          unzip -t build/Patthana_Quest24_Debug.apk > /dev/null
      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Patthana-Quest24-Native-Android-Debug-APK
          path: build/Patthana_Quest24_Debug.apk
          if-no-files-found: error
          retention-days: 14
